name: Build local GivTCP compatibility image
on:
  push:
    branches: [reserve-fix-test]
    paths:
      - GivTCP/write.py
      - tests/test_three_phase_reserve.py
      - tests/test_ac_rate_percent.py
      - tests/golden/hybrid_3ph.json
      - deploy/reserve/**
      - .github/workflows/reserve-test-build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility-tests:
    if: github.repository == 'ggoorts/giv_tcp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - name: Check compatibility tests leave EV charger settings isolated
        run: python -m pytest -q tests/test_ac_rate_percent.py tests/test_three_phase_reserve.py tests/test_evc_runtime.py
      - run: python -m pytest -q tests/test_three_phase_reserve.py tests/test_ac_rate_percent.py tests/test_write_commands.py tests/test_lite_query.py -k 'three_phase_cutoff or setBatteryCutoff or percent_rate or lite_query'
  build:
    needs: compatibility-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build the pinned image locally
        run: docker build --platform linux/arm64 -f deploy/reserve/Dockerfile -t givtcp-candidate:${{ github.sha }} .
      - name: Test exact image runtime with captured mock inverters
        run: |
          docker run --rm --entrypoint /bin/sh -v "$PWD/tests:/app/tests:ro" -v "$PWD/pytest.ini:/app/pytest.ini:ro" givtcp-candidate:${{ github.sha }} -ec 'python3 -m venv --system-site-packages /tmp/qa; /tmp/qa/bin/pip install pytest numpy pandas; cd /app; /tmp/qa/bin/python -m pytest -q tests/test_three_phase_reserve.py tests/test_ac_rate_percent.py tests/test_write_commands.py tests/test_lite_query.py -k "three_phase_cutoff or setBatteryCutoff or percent_rate or lite_query"'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        run: |
          docker tag givtcp-candidate:${{ github.sha }} ghcr.io/ggoorts/givtcp-reserve:3.6.9-reserve.1
          docker tag givtcp-candidate:${{ github.sha }} ghcr.io/ggoorts/givtcp-reserve:sha-${{ github.sha }}
          docker push ghcr.io/ggoorts/givtcp-reserve:3.6.9-reserve.1
          docker push ghcr.io/ggoorts/givtcp-reserve:sha-${{ github.sha }}
