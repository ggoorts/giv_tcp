name: Build local GivTCP compatibility image
on:
  push:
    branches: [reserve-fix-test]
    paths:
      - GivTCP/write.py
      - tests/test_three_phase_reserve.py
      - tests/test_ac_rate_percent.py
      - tests/golden/hybrid_3ph.json
      - deploy/reserve/**
      - .github/workflows/reserve-test-build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reserve-tests:
    if: github.repository == 'ggoorts/giv_tcp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_three_phase_reserve.py tests/test_ac_rate_percent.py tests/test_write_commands.py -k 'three_phase_cutoff or setBatteryCutoff or percent_rate'
  build:
    needs: reserve-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/reserve/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/ggoorts/givtcp-reserve:3.6.8-reserve.2
            ghcr.io/ggoorts/givtcp-reserve:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ggoorts/giv_tcp
            org.opencontainers.image.revision=${{ github.sha }}
